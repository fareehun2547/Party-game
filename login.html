<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login - Poker Swaggie Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050511;
            --accent-pink: #f43f5e;
            --accent-purple: #9333ea;
            --accent-blue: #38bdf8;
            --accent-gold: #fbbf24;
        }
        body { 
            font-family: 'Mali', cursive, sans-serif; 
            background: radial-gradient(circle at center, #1a2e05 0%, #0f172a 50%, var(--bg-deep) 100%); 
            color: #f8fafc; 
            padding: 20px; 
            max-width: 500px; 
            margin: auto; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(56, 189, 248, 0.8) 1.5px, transparent 0);
            background-size: 60px 60px, 90px 90px;
            animation: moveParticles 20s linear infinite;
        }
        @keyframes moveParticles {
            0% { background-position: 0 0, 20px 40px; }
            100% { background-position: 0 500px, 20px 540px; }
        }

        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--accent-blue);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 { 
            font-size: 1.8rem; 
            background: linear-gradient(to right, #f43f5e, #ec4899, #8b5cf6, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px; 
        }

        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-family: 'Mali', cursive;
            font-size: 1.05rem;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(56,189,248,0.3); }

        .login-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #fff; border: none; padding: 14px; border-radius: 14px; width: 100%;
            font-family: 'Mali', cursive; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s, filter 0.2s;
        }
        .login-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Modal Pop-up ยินดีต้อนรับ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #0f172a; border: 3px solid var(--accent-gold); padding: 30px; border-radius: 25px;
            width: 85%; max-width: 340px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>

    <div class="login-box">
        <h1>♠️ Login join party ♣️</h1>
        <p>ใส่ชื่อฉายาเท่ๆ ของเพื่อนก่อนเริ่มความบันเทิง</p>
        
        <input type="text" id="usernameInput" placeholder="พิมพ์ชื่อของคุณที่นี่..." autocomplete="off">
        <button class="login-btn" onclick="submitLogin()">🚀 ลุยกันเลย!</button>
    </div>

    <!-- Modal Pop-up -->
    <div class="modal" id="welcomeModal">
        <div class="modal-content">
            <div style="font-size: 3rem; margin-bottom: 10px;">🍻</div>
            <h2 style="color: var(--accent-gold); margin-bottom: 8px;">ยินดีต้อนรับ!</h2>
            <p id="welcomeText" style="font-size: 1.1rem; color: #f8fafc; margin-bottom: 20px; line-height: 1.5;"></p>
            <button class="login-btn" style="background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); box-shadow:0 5px 15px rgba(251,191,36,0.4); color:#0f172a;" onclick="goToHub()">🎉 เข้าสู่หน้าปาร์ตี้</button>
        </div>
    </div>

    <script>
        function submitLogin() {
            let name = document.getElementById('usernameInput').value.trim();
            if (!name) {
                alert('เฮ้ยเพื่อน! ยังไม่ได้ใส่ชื่อเลยนะ');
                return;
            }
            localStorage.setItem('poker_username', name);
            
            // ใส่ชื่อเข้าไปในกล่อง Pop-up เรียบร้อย
            document.getElementById('welcomeText').innerHTML = `ยินดีต้อนรับคุณ<br><b style="color:#38bdf8; font-size:1.3rem;">"${name}"</b><br>สู่ตี้สุดเดือด!`;
            document.getElementById('welcomeModal').style.display = 'flex';
        }

        function goToHub() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
