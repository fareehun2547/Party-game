<!DOCTYPE html>
<html lang="th">
<head>

    <style>

            --accent-gold: #fbbf24;
        }
        body { 
            font-family: 'Mali', cursive, sans-serif; 
            background: radial-gradient(circle at center, #581c87 0%, #0f172a 60%, var(--bg-deep) 100%); 
            color: #f8fafc; 
            padding: 15px; 
            max-width: 500px; 
            margin: auto; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(rgba(255,255,255,0.8) 1px, transparent 0),
                radial-gradient(rgba(147, 51, 234, 0.5) 1.5px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            animation: moveParticles 25s linear infinite;
        }
        @keyframes moveParticles {
            0% { background-position: 0 0, 10px 30px; }
            100% { background-position: 0 400px, 10px 430px; }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 95vh;
        }

        #setupScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .setup-box {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--accent-purple);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(147, 51, 234, 0.3);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .player-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            max-height: 220px;
            overflow-y: auto;
        }
        .player-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .player-input-row input {
            flex-grow: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-family: 'Mali', cursive;
            outline: none;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            font-family: 'Mali', cursive;
            margin-bottom: 10px;
            outline: none;
        }
        .start-game-btn {
            background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
            color: #fff; border: none; padding: 12px; border-radius: 14px; width: 100%;
            font-family: 'Mali', cursive; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.4); margin-top: 10px;

        #gameScreen {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .current-player-banner {
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid var(--accent-purple);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #d8b4fe;
            margin-bottom: 6px;
            font-weight: bold;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 2px 0; 
        }

            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 3px solid var(--accent-purple);
            border-radius: 24px;

            0% { transform: scale(0.8); opacity: 0; }

            color: #c084fc;
            margin-bottom: 8px;

            font-size: 1.15rem;
            color: #f8fafc;
            line-height: 1.4;
            font-weight: bold;
        }

            background: rgba(15, 23, 42, 0.85);

            color: #fff; text-decoration: none; font-family: 'Mali', cursive; font-weight: bold; font-size: 0.85rem;

</head>

    <div class="particles"></div>

        function generatePlayerInputs() {
            let count = document.getElementById('playerCountSelect').value;
            let container = document.getElementById('playerInputsContainer');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="player-input-row">
                        <span style="font-size:0.85rem; width:55px; text-align:left;">คนที่ ${i+1}:</span>
                        <input type="text" id="playerName_${i}" placeholder="ใส่ชื่อผู้เล่น ${i+1}" value="เพื่อน ${i+1}">
                    </div>
                `;
            }
        }

        function startGame() {
            let count = document.getElementById('playerCountSelect').value;
            players = [];
            for (let i = 0; i < count; i++) {
                let name = document.getElementById(`playerName_${i}`).value.trim();
                if (name) players.push(name);
            }
            if (players.length === 0) {
                alert('กรุณาใส่อย่างน้อย 1 คน!');
                return;
            }
            currentPlayerIndex = 0;
            remainingStatements = [...masterStatements];

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            updateCurrentPlayerUI();
            nextStatement();
        }

        function backToSetup() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
        }

        function updateCurrentPlayerUI() {
            document.getElementById('currentPlayerBanner').innerHTML = `👤 ผู้กล่าวประโยคนี้: <span style="color: #e879f9;">${players[currentPlayerIndex]}</span>`;
        }

        function nextStatement() {
            if (remainingStatements.length === 0) {
                remainingStatements = [...masterStatements];
            }

            let randIdx = Math.floor(Math.random() * remainingStatements.length);
            let text = remainingStatements.splice(randIdx, 1)[0];

            let card = document.getElementById('statementCard');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'popCard 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

            document.getElementById('statementText').innerText = `"${text}"`;

            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateCurrentPlayerUI();
        }

        window.onload = function() {
            generatePlayerInputs();
        };
    </script>
