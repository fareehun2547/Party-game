            padding: 15px;

            flex-direction: column;
            justify-content: space-between;

            background-size: 50px 50px, 80px 80px;
            animation: moveParticles 25s linear infinite;
        }
        @keyframes moveParticles {
            0% { background-position: 0 0, 10px 30px; }
            100% { background-position: 0 400px, 10px 430px; }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 95vh;
        }

            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

            border-radius: 25px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(244, 63, 94, 0.3);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            max-height: 220px;
            overflow-y: auto;
        }
        .player-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .player-input-row input {
            flex-grow: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-family: 'Mali', cursive;
            outline: none;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            font-family: 'Mali', cursive;
            margin-bottom: 10px;
            outline: none;

        .start-game-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: #fff; border: none; padding: 12px; border-radius: 14px; width: 100%;

        #gameScreen {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 3px solid var(--accent-gold);
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;

            font-weight: bold;
            margin: 5px 0 15px 0;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);

            gap: 15px;

            font-weight: bold;

</head>

        function generatePlayerInputs() {
            let count = document.getElementById('playerCountSelect').value;
            let container = document.getElementById('playerInputsContainer');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="player-input-row">
                        <span style="font-size:0.85rem; width:55px; text-align:left;">คนที่ ${i+1}:</span>
                        <input type="text" id="playerName_${i}" placeholder="ใส่ชื่อผู้เล่น ${i+1}" value="เพื่อน ${i+1}">
                    </div>
                `;
            }
        }

        function startGame() {
            let count = document.getElementById('playerCountSelect').value;
            players = [];
            for (let i = 0; i < count; i++) {
                let name = document.getElementById(`playerName_${i}`).value.trim();
                if (name) players.push(name);
            }
            if (players.length === 0) {
                alert('กรุณาใส่อย่างน้อย 1 คน!');
                return;
            }
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            pickRandomPlayer();
        }

        function backToSetup() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
        }

        function pickRandomPlayer() {
            let randomIndex = Math.floor(Math.random() * players.length);
            activePlayer = players[randomIndex];
            document.getElementById('currentTargetName').innerText = activePlayer;
        }

        function pickCard(type) {
            let selectedText = "";
            let titleText = "";
            
            if (type === 'truth') {
                titleText = `💡 TRUTH (${activePlayer})`;
                let randIdx = Math.floor(Math.random() * truthList.length);
                selectedText = truthList[randIdx];
            } else {
                titleText = `🔥 DARE (${activePlayer})`;
                let randIdx = Math.floor(Math.random() * dareList.length);
                selectedText = dareList[randIdx];
            }

            document.getElementById('resultModalTitle').innerText = titleText;
            document.getElementById('resultModalText').innerText = selectedText;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModalAndNext() {
            document.getElementById('resultModal').style.display = 'none';
            pickRandomPlayer();
        }

        window.onload = function() {
            generatePlayerInputs();
        };
